services:
  # 1. FastAPI Backend (REST + WebSockets)
  - type: web
    name: skyguard-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12

  # 2. React Operator Dashboard (Vite + TypeScript)
  - type: web
    name: skyguard-frontend
    env: static
    rootDir: frontend
    buildCommand: pnpm install && pnpm build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
