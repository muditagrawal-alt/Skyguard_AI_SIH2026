services:
  # 1. FastAPI Backend (Docker Web Service)
  - type: web
    name: skyguard-backend
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000

  # 2. React Operator Dashboard (Static Site)
  - type: web
    name: skyguard-frontend
    env: static
    rootDir: frontend
    buildCommand: pnpm install && pnpm build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
